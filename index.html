<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日記帳</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📔</text></svg>">
<style>
  :root {
    --bg-top: #fff7fa;
    --bg-mid: #fef0f7;
    --bg-bot: #fff9f0;
    --card: #ffffff;
    --text: #4a3b42;
    --sub: #b08a97;
    --accent: #ff7aa2;
    --accent-dark: #e85a86;
    --accent-garden: #5cb85c;
    --accent-garden-dark: #3f9142;
    --accent-review: #a78bfa;
    --accent-backup: #7fa9d4;
    --accent-schedule: #5b9bd5;
    --accent-schedule-dark: #3d7ab5;
    --border-schedule: #d5e6f5;
    --border: #ffe1ec;
    --border-garden: #d9f0d9;
    --danger: #f2545b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Maru Gothic ProN", "UD Digi Kyokasho NK-R", "Yu Gothic", "Hiragino Sans", sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg-top), var(--bg-mid) 45%, var(--bg-bot) 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  header { padding: 28px 16px 8px; text-align: center; }
  header h1 { margin: 0; font-size: 1.7rem; letter-spacing: 0.04em; }
  header p { margin: 6px 0 0; color: var(--sub); font-size: 0.85rem; }
  .user-bar { text-align: center; font-size: 0.75rem; color: var(--sub); margin-top: 8px; }
  .user-bar button {
    margin-left: 8px; padding: 3px 12px; font-size: 0.7rem;
    background: #fff; border: 1px solid var(--border); box-shadow: none; border-radius: 999px;
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 18px 16px 4px;
  }
  .nav-btn {
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 999px;
    padding: 9px 18px;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--sub);
    cursor: pointer;
  }
  .nav-btn.active[data-tab="diary"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav-btn.active[data-tab="garden"] { background: var(--accent-garden); border-color: var(--accent-garden); color: #fff; }
  .nav-btn.active[data-tab="review"] { background: var(--accent-review); border-color: var(--accent-review); color: #fff; }
  .nav-btn.active[data-tab="backup"] { background: var(--accent-backup); border-color: var(--accent-backup); color: #fff; }
  .nav-btn.active[data-tab="schedule"] { background: var(--accent-schedule); border-color: var(--accent-schedule); color: #fff; }

  .container { max-width: 760px; margin: 0 auto; padding: 8px 16px 70px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .toolbar { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  .toolbar input[type="text"] {
    flex: 1; min-width: 140px; padding: 11px 14px;
    border: 2px solid var(--border); border-radius: 12px; font-size: 0.95rem;
    background: #fff;
  }
  #tab-garden .toolbar input[type="text"] { border-color: var(--border-garden); }

  button {
    cursor: pointer; border: none; border-radius: 12px;
    padding: 11px 18px; font-size: 0.9rem; font-weight: 700;
    transition: transform 0.1s, opacity 0.15s;
  }
  button:hover { opacity: 0.88; }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 3px 0 var(--accent-dark); }
  #tab-garden .btn-primary { background: var(--accent-garden); box-shadow: 0 3px 0 var(--accent-garden-dark); }
  .btn-secondary { background: #fff; color: var(--text); border: 2px solid var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }

  .ontheday-wrap {
    background: linear-gradient(135deg, #fff0f6, #fff8ef);
    border: 2px dashed var(--accent);
    border-radius: 16px;
    padding: 14px 16px;
    margin: 16px 0;
  }
  .onthisday-title { font-weight: 800; color: var(--accent-dark); margin-bottom: 8px; font-size: 1rem; }
  .onthisday-year { font-size: 0.8rem; font-weight: 700; color: var(--sub); margin: 10px 0 4px; }

  .entry-form {
    background: var(--card); border: 2px solid var(--border); border-radius: 16px;
    padding: 18px; margin-bottom: 20px; display: none;
  }
  #tab-garden .entry-form { border-color: var(--border-garden); }
  .entry-form.open { display: block; }
  .entry-form label { display: block; font-size: 0.8rem; color: var(--sub); margin: 12px 0 4px; font-weight: 700; }
  .entry-form label:first-of-type { margin-top: 0; }
  .entry-form input[type="date"],
  .entry-form input[type="text"],
  .entry-form textarea {
    width: 100%; padding: 11px 14px; border: 2px solid var(--border);
    border-radius: 12px; font-size: 0.95rem; font-family: inherit;
  }
  #tab-garden .entry-form input, #tab-garden .entry-form textarea { border-color: var(--border-garden); }
  .entry-form textarea { min-height: 130px; resize: vertical; line-height: 1.6; }
  .form-actions { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }

  .photo-preview { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
  .photo-thumb { position: relative; display: flex; gap: 10px; align-items: flex-start; width: 100%; padding-right: 30px; }
  .photo-thumb img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 2px solid var(--border); flex-shrink: 0; }
  .photo-thumb .photo-caption {
    flex: 1; min-height: 56px; padding: 8px 10px; font-size: 0.85rem; line-height: 1.5;
    border: 1px solid var(--border); border-radius: 8px; font-family: inherit; resize: vertical;
  }
  .photo-thumb .photo-remove {
    position: absolute; top: 0; right: 0; width: 22px; height: 22px; padding: 0;
    border-radius: 50%; background: var(--danger); color: #fff; font-size: 0.7rem; line-height: 1;
    box-shadow: none;
  }

  .entry-list { display: flex; flex-direction: column; gap: 12px; }
  .companion-block { margin-top: 16px; padding-top: 14px; border-top: 2px dashed var(--border-garden); }
  .companion-label { font-size: 0.75rem; font-weight: 700; color: var(--accent-garden-dark); margin-bottom: 6px; }
  .entry-card {
    background: var(--card); border: 2px solid var(--border); border-radius: 16px;
    padding: 16px; cursor: pointer;
  }
  #tab-garden .entry-card, .entry-card[data-section="garden"] { border-color: var(--border-garden); }
  .entry-card[data-section="garden"] .entry-date { color: var(--accent-garden-dark); }
  .entry-card[data-section="schedule"] { border-color: var(--border-schedule); }
  .entry-card[data-section="schedule"] .entry-date { color: var(--accent-schedule-dark); }
  .entry-card:hover { box-shadow: 0 4px 12px rgba(255, 122, 162, 0.15); }
  .entry-date { font-size: 0.8rem; color: var(--accent-dark); font-weight: 800; margin-bottom: 4px; }
  .category-badge {
    display: inline-block; background: var(--border-garden); color: var(--accent-garden-dark);
    border-radius: 999px; padding: 2px 10px; font-size: 0.7rem; font-weight: 700; margin-left: 8px;
  }
  .category-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: -8px 0 16px; }
  .category-chip {
    background: #fff; border: 2px solid var(--border-garden); color: var(--accent-garden-dark);
    border-radius: 999px; padding: 5px 14px; font-size: 0.8rem; font-weight: 700; box-shadow: none;
  }
  .category-chip.active { background: var(--accent-garden); border-color: var(--accent-garden); color: #fff; }
  .entry-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; }
  .entry-body {
    color: var(--text); font-size: 0.9rem; line-height: 1.65; white-space: pre-wrap;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  }
  .entry-card.expanded .entry-body { display: block; -webkit-line-clamp: unset; }
  .photo-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .photo-strip img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; cursor: zoom-in; }
  .entry-actions { margin-top: 10px; display: flex; gap: 8px; }
  .entry-actions button { padding: 6px 12px; font-size: 0.8rem; box-shadow: none; }

  .empty-state { text-align: center; color: var(--sub); padding: 50px 20px; }

  .review-subnav { display: flex; gap: 8px; margin: 16px 0; }
  .review-subnav button { background: #fff; border: 2px solid var(--border); color: var(--sub); }
  .review-subnav button.active { background: var(--accent-review); border-color: var(--accent-review); color: #fff; }
  .review-panel { display: none; }
  .review-panel.active { display: block; }
  .review-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .review-controls select, .review-controls input[type="date"] {
    padding: 9px 12px; border: 2px solid var(--border); border-radius: 10px; font-size: 0.9rem;
  }
  .review-heading { font-weight: 800; color: var(--accent-review); margin-bottom: 12px; }
  .month-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
  .month-cell { background: #fff; border: 2px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
  .month-label { font-size: 0.75rem; color: var(--sub); font-weight: 700; }
  .month-count { font-size: 1.1rem; font-weight: 800; color: var(--accent-review); }

  .cal-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .cal-controls select {
    padding: 9px 12px; border: 2px solid var(--border-schedule); border-radius: 10px; font-size: 0.9rem;
  }
  .cal-controls button { background: #fff; border: 2px solid var(--border-schedule); color: var(--accent-schedule-dark); }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 20px; }
  .cal-weekday { text-align: center; font-size: 0.75rem; font-weight: 700; color: var(--sub); padding: 4px 0; }
  .cal-day {
    background: #fff; border: 2px solid var(--border-schedule); border-radius: 10px;
    min-height: 64px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
  }
  .cal-day:hover { box-shadow: 0 2px 8px rgba(91, 155, 213, 0.2); }
  .cal-day.empty { background: transparent; border-color: transparent; cursor: default; }
  .cal-day.today { border-color: var(--accent-schedule); border-width: 3px; }
  .cal-day.selected { background: #eaf3fb; }
  .cal-daynum { font-size: 0.75rem; font-weight: 700; color: var(--text); }
  .cal-event-chip {
    background: var(--border-schedule); color: var(--accent-schedule-dark); border-radius: 6px;
    padding: 1px 4px; font-size: 0.65rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cal-event-bar {
    background: var(--accent-schedule); color: #fff; border-radius: 6px;
    padding: 1px 4px; font-size: 0.65rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cal-event-bar.bar-cont-left { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .cal-event-bar.bar-cont-right { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .category-legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .category-legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 700; color: var(--sub); }
  .category-legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .schedule-category-badge {
    display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 0.7rem; font-weight: 700; margin-left: 8px;
  }

  .year-gantt-wrap { overflow-x: auto; margin-bottom: 20px; -webkit-overflow-scrolling: touch; border: 2px solid var(--border-schedule); border-radius: 12px; }
  .year-gantt-v { display: grid; grid-template-rows: 34px repeat(31, 24px); background: #fff; }
  .gantt-daylabel-corner {
    position: sticky; left: 0; z-index: 2; background: #fff;
    border-right: 2px solid var(--border-schedule); border-bottom: 2px solid var(--border-schedule);
  }
  .gantt-month-header {
    background: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem; font-weight: 800; color: var(--accent-schedule-dark); cursor: pointer;
    border-bottom: 2px solid var(--border-schedule); border-right: 1px solid var(--border-schedule);
  }
  .gantt-daylabel {
    position: sticky; left: 0; z-index: 1; background: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-weight: 700; color: var(--sub);
    border-right: 2px solid var(--border-schedule); border-bottom: 1px solid var(--border-schedule);
  }
  .gantt-daycell-v {
    border-right: 1px solid var(--border-schedule); border-bottom: 1px solid var(--border-schedule); cursor: pointer;
  }
  .gantt-daycell-v:hover { background: #eaf3fb; }
  .gantt-daycell-v.today { background: #fff6e0; }
  .gantt-daycell-v.invalid {
    background: repeating-linear-gradient(45deg, #f4f4f4, #f4f4f4 4px, #eaeaea 4px, #eaeaea 8px);
    cursor: default;
  }
  .gantt-bar-v {
    margin: 1px 2px; border-radius: 4px; font-size: 0.66rem; font-weight: 700; padding: 2px 5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
  }
  .schedule-form-date { font-weight: 800; color: var(--accent-schedule-dark); margin-bottom: 8px; }
  #scheduleEntryForm { border-color: var(--border-schedule); }
  #scheduleEntryForm input, #scheduleEntryForm textarea { border-color: var(--border-schedule); }
  #tab-schedule .btn-primary { background: var(--accent-schedule); box-shadow: 0 3px 0 var(--accent-schedule-dark); }
  @media (max-width: 480px) {
    .cal-day { min-height: 48px; }
    .cal-event-chip { font-size: 0.6rem; }
  }

  .backup-panel { text-align: center; }
  .backup-panel p { color: var(--sub); font-size: 0.85rem; line-height: 1.7; max-width: 480px; margin: 12px auto; }
  .backup-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .backup-actions button { background: #fff; border: 2px solid var(--accent-backup); color: var(--accent-backup); }

  .lightbox {
    display: none; position: fixed; inset: 0; background: rgba(20, 12, 16, 0.9);
    z-index: 1000; align-items: center; justify-content: center; flex-direction: column; padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 75vh; border-radius: 10px; }
  .lightbox-caption { color: #fff; margin-top: 12px; font-size: 0.95rem; text-align: center; max-width: 80vw; }
  .lightbox-close {
    position: absolute; top: 16px; right: 20px; background: rgba(255,255,255,0.15); color: #fff;
    width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; box-shadow: none;
  }
  .lightbox-nav {
    position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15);
    color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 1.4rem; box-shadow: none;
  }
  .lightbox-nav.prev { left: 16px; }
  .lightbox-nav.next { right: 16px; }

  .auth-gate {
    position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--bg-top), var(--bg-mid) 45%, var(--bg-bot) 100%);
  }
  .auth-card {
    background: #fff; border-radius: 20px; padding: 40px 32px; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08); max-width: 320px;
  }
  .auth-card .auth-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 14px; }
  .auth-card p { color: var(--sub); font-size: 0.85rem; margin-bottom: 22px; line-height: 1.6; }
  .auth-card button { width: 100%; }

  @media (max-width: 480px) {
    .month-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="auth-title">🌸 日記帳 🌱</div>
    <p>データはあなたのGoogleアカウントに安全に保存され、パソコンとスマホで自動的に同期されます。</p>
    <button class="btn-primary" id="googleSignInBtn">Googleでログイン</button>
  </div>
</div>

<div id="appContent" style="display:none;">

<header>
  <h1>🌸 日記帳 🌱</h1>
  <p>毎日のこと、庭のこと、少しずつ書き残す</p>
  <div class="user-bar" id="userBar"></div>
</header>

<nav class="tabs">
  <button class="nav-btn active" data-tab="diary">📔 日記</button>
  <button class="nav-btn" data-tab="garden">🌱 園芸</button>
  <button class="nav-btn" data-tab="schedule">🗓️ 予定</button>
  <button class="nav-btn" data-tab="review">📅 振り返り</button>
  <button class="nav-btn" data-tab="backup">💾 バックアップ</button>
</nav>

<main class="container">

  <section id="tab-diary" class="tab-panel active">
    <div id="tab-diary-body"></div>
  </section>

  <section id="tab-garden" class="tab-panel">
    <div id="tab-garden-body"></div>
  </section>

  <section id="tab-schedule" class="tab-panel">
    <div class="review-subnav schedule-subnav">
      <button class="active" data-schedule="month">月間</button>
      <button data-schedule="year">年間</button>
    </div>

    <div class="review-panel active" id="schedule-month">
      <div class="cal-controls">
        <button class="btn-secondary" id="calPrevMonth">‹ 前月</button>
        <select id="scheduleCalYear"></select>
        <select id="scheduleCalMonth"></select>
        <button class="btn-secondary" id="calNextMonth">翌月 ›</button>
      </div>
      <div class="category-legend" id="scheduleCategoryLegend"></div>
      <div class="calendar-grid" id="scheduleCalendarGrid"></div>

      <div class="entry-form" id="scheduleEntryForm">
        <input type="hidden" id="scheduleEditingId">
        <div class="schedule-form-date" id="scheduleFormDateLabel"></div>
        <label>開始日</label>
        <input type="date" id="scheduleStartDate">
        <label>終了日（連続する予定の場合。1日だけなら空欄でOK）</label>
        <input type="date" id="scheduleEndDate">
        <label>カテゴリ（色分け）</label>
        <select id="scheduleCategorySelect"></select>
        <label>タイトル</label>
        <input type="text" id="scheduleEntryTitle" placeholder="例：病院の予約">
        <label>メモ（任意）</label>
        <textarea id="scheduleEntryNote" placeholder="時間や持ち物など"></textarea>
        <div class="form-actions">
          <button class="btn-secondary" id="scheduleCancelBtn">キャンセル</button>
          <button class="btn-primary" id="scheduleSaveBtn">保存する</button>
        </div>
      </div>
      <div id="scheduleDayPanel"></div>
    </div>

    <div class="review-panel" id="schedule-year">
      <div class="review-controls">
        <select id="scheduleYearOnly"></select>
        <button class="btn-secondary" id="scheduleYearShow">表示</button>
      </div>
      <div id="scheduleYearResult"></div>
    </div>
  </section>

  <section id="tab-review" class="tab-panel">
    <div class="review-subnav">
      <button class="active" data-review="week">週間</button>
      <button data-review="month">月間</button>
      <button data-review="year">年間</button>
    </div>

    <div class="review-panel active" id="review-week">
      <div class="review-controls">
        <input type="date" id="reviewWeekDate">
        <button class="btn-secondary" id="reviewWeekShow">表示</button>
      </div>
      <div id="reviewWeekResult"></div>
    </div>

    <div class="review-panel" id="review-month">
      <div class="review-controls">
        <select id="reviewYear"></select>
        <select id="reviewMonth"></select>
        <button class="btn-secondary" id="reviewMonthShow">表示</button>
      </div>
      <div id="reviewMonthResult"></div>
    </div>

    <div class="review-panel" id="review-year">
      <div class="review-controls">
        <select id="reviewYearOnly"></select>
        <button class="btn-secondary" id="reviewYearShow">表示</button>
      </div>
      <div id="reviewYearResult"></div>
    </div>
  </section>

  <section id="tab-backup" class="tab-panel">
    <div class="backup-panel">
      <p>
        日記・園芸・写真は自動的にクラウド（Firebase）に保存され、
        ログインしたパソコン・スマホどちらでも同じ内容がすぐに反映されます。<br>
        こちらのバックアップ機能は「万が一に備えた保存用ファイル」です。
        普段の利用では押す必要はありません。
      </p>
      <div class="backup-actions">
        <button id="exportBtn">📤 バックアップを保存(JSON)</button>
        <button id="importBtn">📥 読み込む（上書き）</button>
        <input type="file" id="importFile" accept=".json" style="display:none;">
      </div>
    </div>
  </section>

</main>

</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <button class="lightbox-nav prev" id="lightboxPrev">‹</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
  <button class="lightbox-nav next" id="lightboxNext">›</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* ---------- Utilities ---------- */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function pad(n) { return String(n).padStart(2, '0'); }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function formatDateJp(dateStr) {
  const [y, m, d] = dateStr.split('-');
  const dow = ['日', '月', '火', '水', '木', '金', '土'][new Date(dateStr + 'T00:00:00').getDay()];
  return `${y}年${m}月${d}日（${dow}）`;
}
function toDateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function getWeekRange(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const start = new Date(d); start.setDate(d.getDate() - day);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return [toDateStr(start), toDateStr(end)];
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}
function resizeImage(file, maxDim = 1280, quality = 0.75) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function startListeners() {
  unsubEntries = onSnapshot(collection(db, 'entries'), async (snap) => {
    const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    diaryEntries = all.filter(e => e.section === 'diary');
    gardenEntries = all.filter(e => e.section === 'garden');
    await refreshAllViews();
  });
  unsubPhotos = onSnapshot(collection(db, 'photos'), async (snap) => {
    allPhotos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    await refreshAllViews();
  });
  unsubSchedule = onSnapshot(collection(db, 'schedule'), async (snap) => {
    scheduleEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    await refreshAllViews();
  });
}
function stopListeners() {
  if (unsubEntries) { unsubEntries(); unsubEntries = null; }
  if (unsubPhotos) { unsubPhotos(); unsubPhotos = null; }
  if (unsubSchedule) { unsubSchedule(); unsubSchedule = null; }
  diaryEntries = []; gardenEntries = []; allPhotos = []; scheduleEvents = [];
}

/* ---------- Form state (per section) ---------- */
const formPhotos = { diary: [], garden: [] };
const removedPhotoIds = { diary: [], garden: [] };

function openForm(section, entry) {
  document.getElementById(`${section}EntryForm`).classList.add('open');
  removedPhotoIds[section] = [];
  const categoryEl = document.getElementById(`${section}EntryCategory`);
  if (entry) {
    document.getElementById(`${section}EditingId`).value = entry.id;
    document.getElementById(`${section}EntryDate`).value = entry.date;
    if (categoryEl) categoryEl.value = entry.category || '';
    document.getElementById(`${section}EntryTitle`).value = entry.title || '';
    document.getElementById(`${section}EntryBody`).value = entry.body || '';
    const photos = getPhotosForEntry(`${section}_${entry.id}`);
    formPhotos[section] = photos.map(p => ({ id: p.id, dataUrl: p.dataUrl, caption: p.caption || '' }));
  } else {
    document.getElementById(`${section}EditingId`).value = '';
    document.getElementById(`${section}EntryDate`).value = todayStr();
    if (categoryEl) categoryEl.value = '';
    document.getElementById(`${section}EntryTitle`).value = '';
    document.getElementById(`${section}EntryBody`).value = '';
    formPhotos[section] = [];
  }
  renderFormPhotos(section);
  document.getElementById(`${section}EntryBody`).focus();
}
function closeForm(section) {
  document.getElementById(`${section}EntryForm`).classList.remove('open');
}

function renderFormPhotos(section) {
  const container = document.getElementById(`${section}PhotoPreview`);
  container.innerHTML = formPhotos[section].map((p, i) => `
    <div class="photo-thumb">
      <img src="${p.dataUrl}">
      <textarea class="photo-caption" data-idx="${i}" placeholder="この写真の説明を入力（例：今年初めての開花。去年より2週間早い）">${escapeHtml(p.caption)}</textarea>
      <button type="button" class="photo-remove" data-idx="${i}">✕</button>
    </div>
  `).join('');
  container.querySelectorAll('.photo-caption').forEach(inp => {
    inp.addEventListener('input', () => {
      formPhotos[section][parseInt(inp.dataset.idx, 10)].caption = inp.value;
    });
  });
  container.querySelectorAll('.photo-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx, 10);
      const removed = formPhotos[section].splice(idx, 1)[0];
      if (removed.id) removedPhotoIds[section].push(removed.id);
      renderFormPhotos(section);
    });
  });
}

async function saveEntry(section) {
  const date = document.getElementById(`${section}EntryDate`).value || todayStr();
  const title = document.getElementById(`${section}EntryTitle`).value.trim();
  const body = document.getElementById(`${section}EntryBody`).value.trim();
  const categoryEl = document.getElementById(`${section}EntryCategory`);
  const category = categoryEl ? categoryEl.value.trim() : '';
  if (!body) { alert('本文を入力してください。'); return; }

  const editingId = document.getElementById(`${section}EditingId`).value;
  const id = editingId || uid();
  const existing = editingId ? entriesOf(section).find(e => e.id === id) : null;

  await setDoc(doc(db, 'entries', id), {
    section, date, title, body, category,
    createdAt: existing ? existing.createdAt : Date.now()
  });

  for (const pid of removedPhotoIds[section]) await deleteDoc(doc(db, 'photos', pid));
  const entryKey = `${section}_${id}`;
  for (let i = 0; i < formPhotos[section].length; i++) {
    const p = formPhotos[section][i];
    const photoId = p.id || uid();
    await setDoc(doc(db, 'photos', photoId), {
      entryId: id, section, entryKey, caption: p.caption || '', order: i,
      dataUrl: p.dataUrl, createdAt: Date.now()
    });
  }
  closeForm(section);
}

async function deleteEntry(section, id) {
  if (!confirm('この記録を削除しますか？（写真も削除されます）')) return;
  const photos = getPhotosForEntry(`${section}_${id}`);
  const batch = writeBatch(db);
  batch.delete(doc(db, 'entries', id));
  for (const p of photos) batch.delete(doc(db, 'photos', p.id));
  await batch.commit();
}

/* ---------- Card rendering (shared by lists, reviews, on-this-day) ---------- */
async function buildEntryCard(entry, section, opts = {}) {
  const photos = getPhotosForEntry(`${section}_${entry.id}`);
  const card = document.createElement('div');
  card.className = 'entry-card';
  card.dataset.section = section;
  const icon = section === 'garden' ? '🌱' : '📔';
  const photosHtml = photos.length
    ? `<div class="photo-strip">${photos.map((p, i) => `<img data-idx="${i}" class="thumb" src="${p.dataUrl}">`).join('')}</div>`
    : '';
  card.innerHTML = `
    <div class="entry-date">${icon} ${formatDateJp(entry.date)}${entry.category ? `<span class="category-badge">${escapeHtml(entry.category)}</span>` : ''}</div>
    ${entry.title ? `<div class="entry-title">${escapeHtml(entry.title)}</div>` : ''}
    <div class="entry-body">${escapeHtml(entry.body)}</div>
    ${photosHtml}
    ${opts.showActions !== false ? `
      <div class="entry-actions">
        <button class="btn-secondary edit-btn">編集</button>
        <button class="btn-danger delete-btn">削除</button>
      </div>` : ''}
  `;
  if (photos.length) {
    card.querySelectorAll('.thumb').forEach(img => {
      img.addEventListener('click', (e) => {
        e.stopPropagation();
        openLightbox(photos, parseInt(img.dataset.idx, 10));
      });
    });
  }
  if (opts.showActions !== false) {
    card.querySelector('.edit-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      switchTab(section);
      openForm(section, entry);
    });
    card.querySelector('.delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteEntry(section, entry.id);
    });
  }
  card.addEventListener('click', (e) => {
    if (e.target.closest('.entry-actions') || e.target.closest('.thumb')) return;
    card.classList.toggle('expanded');
  });
  return card;
}

/* Groups a chronological list of tagged entries (diary+garden) by date,
   merging same-date diary+garden pairs into one combined card. */
async function buildGroupedCards(taggedEntries, opts = {}) {
  const order = [];
  const byDate = new Map();
  for (const e of taggedEntries) {
    if (!byDate.has(e.date)) { byDate.set(e.date, { diary: [], garden: [] }); order.push(e.date); }
    byDate.get(e.date)[e.section].push(e);
  }
  const cards = [];
  for (const date of order) {
    const group = byDate.get(date);
    let gardenLeft = group.garden.slice();
    if (group.diary.length) {
      for (const d of group.diary) {
        if (gardenLeft.length) {
          cards.push(await buildCombinedCard(d, gardenLeft, opts));
          gardenLeft = [];
        } else {
          cards.push(await buildEntryCard(d, 'diary', opts));
        }
      }
    } else if (gardenLeft.length > 1) {
      cards.push(await buildGardenOnlyCard(gardenLeft, opts));
    } else {
      for (const g of gardenLeft) cards.push(await buildEntryCard(g, 'garden', opts));
    }
  }
  return cards;
}

function renderCategoryChips(section) {
  const container = document.getElementById(`${section}CategoryChips`);
  if (!container) return;
  const categories = [...new Set(entriesOf(section).map(e => (e.category || '').trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'ja'));
  const searchInput = document.getElementById(`${section}SearchInput`);
  const currentKeyword = searchInput.value.trim();
  if (!categories.length) { container.innerHTML = ''; return; }
  container.innerHTML = categories.map(c => `
    <button type="button" class="category-chip${c === currentKeyword ? ' active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>
  `).join('');
  container.querySelectorAll('.category-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      searchInput.value = (searchInput.value.trim() === btn.dataset.cat) ? '' : btn.dataset.cat;
      render(section);
    });
  });
}

async function render(section) {
  const keyword = document.getElementById(`${section}SearchInput`).value.trim().toLowerCase();
  let filtered = entriesOf(section).slice()
    .sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
  if (keyword) {
    filtered = filtered.filter(e =>
      (e.title || '').toLowerCase().includes(keyword) ||
      (e.body || '').toLowerCase().includes(keyword) ||
      (e.category || '').toLowerCase().includes(keyword) ||
      e.date.includes(keyword)
    );
  }
  renderCategoryChips(section);
  const listEl = document.getElementById(`${section}EntryList`);
  const emptyEl = document.getElementById(`${section}EmptyState`);
  listEl.innerHTML = '';
  emptyEl.style.display = filtered.length === 0 ? 'block' : 'none';
  let tagged;
  if (section === 'diary') {
    const filteredDates = new Set(filtered.map(e => e.date));
    tagged = [
      ...filtered.map(e => ({ ...e, section: 'diary' })),
      ...gardenEntries.filter(g => filteredDates.has(g.date)).map(g => ({ ...g, section: 'garden' }))
    ];
  } else {
    tagged = filtered.map(e => ({ ...e, section: 'garden' }));
  }
  for (const card of await buildGroupedCards(tagged)) listEl.appendChild(card);
}

/* ---------- On-this-day (up to 5 years back) ---------- */
async function renderOnThisDay() {
  const container = document.getElementById('onThisDay');
  if (!container) return;
  const today = new Date();
  const mm = pad(today.getMonth() + 1);
  const dd = pad(today.getDate());
  const blocks = [];
  for (let y = 1; y <= 5; y++) {
    const dateStr = `${today.getFullYear() - y}-${mm}-${dd}`;
    const matches = [
      ...diaryEntries.filter(e => e.date === dateStr).map(e => ({ ...e, section: 'diary' })),
      ...gardenEntries.filter(e => e.date === dateStr).map(e => ({ ...e, section: 'garden' }))
    ];
    if (matches.length) blocks.push({ y, matches });
  }
  if (!blocks.length) { container.style.display = 'none'; container.innerHTML = ''; return; }
  container.style.display = 'block';
  container.innerHTML = `<div class="onthisday-title">✨ ${mm}月${dd}日の思い出</div>`;
  for (const b of blocks) {
    const label = document.createElement('div');
    label.className = 'onthisday-year';
    label.textContent = `${b.y}年前`;
    container.appendChild(label);
    for (const card of await buildGroupedCards(b.matches, { showActions: false })) container.appendChild(card);
  }
}

function eventEndDate(ev) { return ev.endDate || ev.date; }
function eventSpansDate(ev, dateStr) { return ev.date <= dateStr && eventEndDate(ev) >= dateStr; }

function renderScheduleMonth() {
  const grid = document.getElementById('scheduleCalendarGrid');
  if (!grid) return;
  const weekdayNames = ['日', '月', '火', '水', '木', '金', '土'];
  let html = weekdayNames.map(w => `<div class="cal-weekday">${w}</div>`).join('');

  const firstDay = new Date(calYear, calMonth - 1, 1);
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const startWeekday = firstDay.getDay();
  const today = todayStr();

  for (let i = 0; i < startWeekday; i++) html += '<div class="cal-day empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${pad(calMonth)}-${pad(d)}`;
    const colIndex = (startWeekday + d - 1) % 7;
    const dayEvents = scheduleEvents.filter(ev => eventSpansDate(ev, dateStr))
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    const maxShow = 2;
    const shown = dayEvents.slice(0, maxShow).map(ev => {
      const cat = scheduleCategoryOf(ev);
      const colorStyle = cat ? ` style="background:${cat.bg};color:${cat.text}"` : '';
      const isMulti = eventEndDate(ev) !== ev.date;
      if (!isMulti) return `<div class="cal-event-chip"${colorStyle}>${escapeHtml(ev.title)}</div>`;
      const isStart = ev.date === dateStr;
      const isEnd = eventEndDate(ev) === dateStr;
      const roundLeft = isStart || colIndex === 0;
      const roundRight = isEnd || colIndex === 6;
      const classes = ['cal-event-bar'];
      if (!roundLeft) classes.push('bar-cont-left');
      if (!roundRight) classes.push('bar-cont-right');
      const label = (isStart || colIndex === 0) ? escapeHtml(ev.title) : '';
      return `<div class="${classes.join(' ')}"${colorStyle}>${label}</div>`;
    }).join('') + (dayEvents.length > maxShow ? `<div class="cal-event-chip">+${dayEvents.length - maxShow}件</div>` : '');
    const classes = ['cal-day'];
    if (dateStr === today) classes.push('today');
    if (dateStr === selectedScheduleDate) classes.push('selected');
    html += `<div class="${classes.join(' ')}" data-date="${dateStr}"><div class="cal-daynum">${d}</div>${shown}</div>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.cal-day:not(.empty)').forEach(cell => {
    cell.addEventListener('click', () => openScheduleDay(cell.dataset.date));
  });
}

function openScheduleDay(dateStr) {

/* Year view: rows = day-of-month (1-31), columns = months (Jan-Dec).
   Each month occupies 1 or more sub-columns depending on how many
   events overlap within it, so overlapping events sit side by side. */
function buildYearGanttVertical(year) {
  const today = todayStr();
  const monthsInfo = [];
  let cursor = 2; // column 1 is the day-of-month label
  for (let m = 1; m <= 12; m++) {
    const daysInMonth = new Date(year, m, 0).getDate();
    const monthStart = `${year}-${pad(m)}-01`;
    const monthEnd = `${year}-${pad(m)}-${pad(daysInMonth)}`;
    const yearViewCategoryIds = new Set(SCHEDULE_CATEGORIES.slice(0, 3).map(c => c.id));
    const events = scheduleEvents
      .filter(ev => yearViewCategoryIds.has(ev.categoryId) && eventEndDate(ev) >= monthStart && ev.date <= monthEnd)
      .sort((a, b) => a.date.localeCompare(b.date));
    const trackEnds = [];
    const placed = events.map(ev => {
      const dispStart = ev.date < monthStart ? monthStart : ev.date;
      const dispEnd = eventEndDate(ev) > monthEnd ? monthEnd : eventEndDate(ev);
      let track = trackEnds.findIndex(end => end < dispStart);
      if (track === -1) { track = trackEnds.length; trackEnds.push(dispEnd); }
      else trackEnds[track] = dispEnd;
      return { ev, dispStart, dispEnd, track };
    });
    const trackCount = Math.max(1, trackEnds.length);
    monthsInfo.push({ m, daysInMonth, placed, trackCount, startCol: cursor });
    cursor += trackCount;
  }
  const totalSubCols = cursor - 2;

  let html = '<div class="gantt-daylabel-corner" style="grid-column:1;grid-row:1;"></div>';
  for (const mi of monthsInfo) {
    html += `<div class="gantt-month-header" style="grid-column:${mi.startCol} / span ${mi.trackCount};grid-row:1;" data-year="${year}" data-month="${mi.m}">${mi.m}月</div>`;
  }
  for (let d = 1; d <= 31; d++) {
    html += `<div class="gantt-daylabel" style="grid-column:1;grid-row:${d + 1};">${d}</div>`;
  }
  for (const mi of monthsInfo) {
    for (let d = 1; d <= 31; d++) {
      if (d > mi.daysInMonth) {
        html += `<div class="gantt-daycell-v invalid" style="grid-column:${mi.startCol} / span ${mi.trackCount};grid-row:${d + 1};"></div>`;
      } else {
        const dateStr = `${year}-${pad(mi.m)}-${pad(d)}`;
        const cls = ['gantt-daycell-v'];
        if (dateStr === today) cls.push('today');
        html += `<div class="${cls.join(' ')}" style="grid-column:${mi.startCol} / span ${mi.trackCount};grid-row:${d + 1};" data-date="${dateStr}"></div>`;
      }
    }
    for (const { ev, dispStart, dispEnd, track } of mi.placed) {
      const startDay = parseInt(dispStart.split('-')[2], 10);
      const endDay = parseInt(dispEnd.split('-')[2], 10);
      const cat = scheduleCategoryOf(ev);
      const bg = cat ? cat.bg : 'var(--accent-schedule)';
      const color = cat ? cat.text : '#ffffff';
      html += `<div class="gantt-bar-v" data-date="${ev.date}"
        style="grid-column:${mi.startCol + track};grid-row:${startDay + 1} / span ${endDay - startDay + 1};background:${bg};color:${color};"
        title="${escapeHtml(ev.title)}">${escapeHtml(ev.title)}</div>`;
    }
  }
  return { html, totalSubCols };
}

function showScheduleYearReview() {
  const yearEl = document.getElementById('scheduleYearOnly');

  const year = parseInt(yearEl.value || calYear, 10);
  const container = document.getElementById('scheduleYearResult');
  const { html, totalSubCols } = buildYearGanttVertical(year);
  container.innerHTML = `<div class="year-gantt-wrap"><div class="year-gantt-v" style="grid-template-columns: 34px repeat(${totalSubCols}, minmax(82px, 1fr));">${html}</div></div>`;
  container.querySelectorAll('.gantt-daycell-v:not(.invalid)').forEach(cell => {
    cell.addEventListener('click', () => jumpToScheduleMonthDay(cell.dataset.date));

    label.addEventListener('click', () => switchToScheduleMonthView(parseInt(label.dataset.year, 10), parseInt(label.dataset.month, 10)));
  });
}

document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      const importedEntries = [
        ...(data.diaryEntries || []).map(en => ({ ...en, section: 'diary' })),
        ...(data.gardenEntries || []).map(en => ({ ...en, section: 'garden' }))
      ];
      const importedPhotos = data.photos || [];
      const importedSchedule = data.scheduleEvents || [];
      if (!confirm(`日記・園芸あわせて${importedEntries.length}件、写真${importedPhotos.length}枚、予定${importedSchedule.length}件を読み込みます。現在のクラウド上のデータは上書きされます。よろしいですか？`)) return;

      const existingEntries = await getDocs(collection(db, 'entries'));
      const existingPhotos = await getDocs(collection(db, 'photos'));
      const existingSchedule = await getDocs(collection(db, 'schedule'));
      let batch = writeBatch(db);
      let ops = 0;
      const flushIfNeeded = async () => { if (ops >= 400) { await batch.commit(); batch = writeBatch(db); ops = 0; } };
      for (const d of existingEntries.docs) { batch.delete(d.ref); ops++; await flushIfNeeded(); }
      for (const d of existingPhotos.docs) { batch.delete(d.ref); ops++; await flushIfNeeded(); }
      for (const d of existingSchedule.docs) { batch.delete(d.ref); ops++; await flushIfNeeded(); }
      await batch.commit();

      batch = writeBatch(db); ops = 0;
      for (const en of importedEntries) {
        const id = en.id || uid();
        batch.set(doc(db, 'entries', id), {
          section: en.section, date: en.date, title: en.title || '', body: en.body || '',
          category: en.category || '', createdAt: en.createdAt || Date.now()
        });
        ops++; await flushIfNeeded();
      }
      for (const p of importedPhotos) {
        const id = p.id || uid();
        batch.set(doc(db, 'photos', id), {
          entryId: p.entryId, section: p.section, entryKey: p.entryKey,
          caption: p.caption || '', order: p.order || 0, dataUrl: p.dataUrl,
          createdAt: p.createdAt || Date.now()
        });
        ops++; await flushIfNeeded();
      }
      for (const ev of importedSchedule) {
        const id = ev.id || uid();
        batch.set(doc(db, 'schedule', id), {
          date: ev.date, endDate: ev.endDate || ev.date, categoryId: ev.categoryId || '',
          title: ev.title || '', note: ev.note || '',
          createdAt: ev.createdAt || Date.now()
        });
        ops++; await flushIfNeeded();
      }
      await batch.commit();
      alert('読み込みが完了しました。');
    } catch (err) {
      console.error(err);
      alert('読み込みに失敗しました。ファイルの形式を確認してください。');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
</script>
